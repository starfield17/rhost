name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # A tag is not evidence that the code works. Everything the repository calls a
  # gate runs here first, so a red tree cannot become a published binary.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
      - name: Check (gofmt + vet + unit tests + portability, AGENTS.md §9)
        run: make check

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse --short HEAD)"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pkg="github.com/starfield17/rhost/internal/buildinfo"
          out="rhost_${version}_${GOOS}_${GOARCH}"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-X ${pkg}.Version=${version} -X ${pkg}.Commit=${commit} -X ${pkg}.BuildDate=${date}" \
            -o "dist/${out}" ./cmd/rhost
          ( cd dist && shasum -a 256 "${out}" > "${out}.sha256" )

      - uses: actions/upload-artifact@v7
        with:
          name: rhost-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # A tag with a hyphen is a semver prerelease, and it is marked as one:
          # `install.sh` falls back to the newest release when no stable one
          # exists, so "alpha" is a statement about maturity, not a hidden flag.
          prerelease: ${{ contains(github.ref_name, '-') && 'true' || 'false' }}
