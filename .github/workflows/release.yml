name: Rust artifact rehearsal
# Publishing remains disabled until remote conformance and live gates pass.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin_amd64
          - runner: macos-15
            platform: darwin_arm64
          - runner: ubuntu-24.04
            platform: linux_amd64
          - runner: ubuntu-24.04-arm
            platform: linux_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and execute exact native artifact
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          cargo build --locked --release --bin rhost
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          mkdir -p dist
          artifact="dist/rhost_${version}_${PLATFORM}"
          cp target/release/rhost "$artifact"
          "$artifact" version --json
          "$artifact" --help
          shasum -a 256 "$artifact" > "$artifact.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rhost-${{ matrix.platform }}
          path: dist/*
