name: release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: read
  actions: read
jobs:
  helper-verify:
    uses: ./.github/workflows/helper-verify.yml
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      CC: clang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The measurement check compares the tagged range with the previous
          # tag, so the verify job needs tags and history.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install declared Rust toolchain
        run: |
          rust_version=$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$rust_version" --profile minimal
          rustup component add --toolchain "$rust_version" rustfmt clippy
          rustup override set "$rust_version"
      - run: make check
      - name: Prevent weakening the measurement between releases
        run: |
          # The tagged range is compared with the previous tag; a first release
          # with no tag falls back to the parent commit.
          base=$(git describe --tags --match 'v[0-9]*' --abbrev=0 'HEAD^' 2>/dev/null || echo 'HEAD^')
          ./scripts/check-integrity.sh "$base"
  native:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin_amd64
          - runner: macos-15
            platform: darwin_arm64
          - runner: ubuntu-24.04
            platform: linux_amd64
          - runner: ubuntu-24.04-arm
            platform: linux_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install declared Rust toolchain
        run: |
          rust_version=$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$rust_version" --profile minimal
          rustup override set "$rust_version"
      - name: Prove the rehearsal still matches the release contract
        run: ./scripts/check-release-contract.sh
      - name: Build and execute exact native artifact
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          commit=$(git rev-parse HEAD)
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ "$GITHUB_EVENT_NAME" = push ]; then test "$GITHUB_REF_NAME" = "v${version}"; fi
          mkdir -p dist
          artifact="dist/rhost_${version}_${PLATFORM}"
          RHOST_BUILD_COMMIT="$commit" RHOST_BUILD_DATE="$build_date" \
            cargo build --locked --release --bin rhost
          cp target/release/rhost "$artifact"
          reported=$("$artifact" version --json)
          printf '%s\n' "$reported"
          printf '%s' "$reported" |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["data"]["version"] == sys.argv[1], d; assert d["schema_version"] == d["data"]["schema_version"] == 6, d' "$version"
          printf '%s' "$reported" |
            python3 -c 'import json,re,sys; d=json.load(sys.stdin); assert d["data"]["commit"] == sys.argv[1], d; assert re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z", d["data"]["build_date"]), d' "$commit"
          "$artifact" --help
          asset_name=${artifact##*/}
          (cd dist && shasum -a 256 "$asset_name" > "$asset_name.sha256")
          (cd dist && shasum -a 256 -c "$asset_name.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rhost-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 30
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, native, helper-verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: rhost-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: helper-linux-*
          path: dist
          merge-multiple: true
      - name: Publish the verified native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          sh scripts/verify-release-assets.sh "$version" dist
          gh release create "v${version}" dist/* --verify-tag --title "rhost v${version}" --generate-notes
