name: release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin_amd64
          - runner: macos-15
            platform: darwin_arm64
          - runner: ubuntu-24.04
            platform: linux_amd64
          - runner: ubuntu-24.04-arm
            platform: linux_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prove the rehearsal still matches the release contract
        run: ./scripts/check-release-contract.sh
      - name: Build and execute exact native artifact
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          commit=$(git rev-parse --short HEAD)
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RHOST_BUILD_COMMIT="$commit" RHOST_BUILD_DATE="$build_date" \
            cargo build --locked --release --bin rhost
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v${version}"; fi
          mkdir -p dist
          artifact="dist/rhost_${version}_${PLATFORM}"
          cp target/release/rhost "$artifact"
          reported=$("$artifact" version --json)
          printf '%s\n' "$reported"
          printf '%s' "$reported" |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["data"]["version"] == sys.argv[1], d' "$version"
          printf '%s' "$reported" |
            python3 -c 'import json,re,sys; d=json.load(sys.stdin); assert d["data"]["commit"] == sys.argv[1], d; assert re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z", d["data"]["build_date"]), d' "$commit"
          "$artifact" --help
          asset_name=${artifact##*/}
          (cd dist && shasum -a 256 "$asset_name" > "$asset_name.sha256")
          (cd dist && shasum -a 256 -c "$asset_name.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rhost-${{ matrix.platform }}
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true
      - name: Publish the verified native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          test "$(find dist -maxdepth 1 -type f -name 'rhost_*' | wc -l | tr -d ' ')" = 8
          gh release create "v${version}" dist/* --verify-tag --title "rhost v${version}" --generate-notes
