name: helper-verify
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  helper:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
          - runner: macos-15
            target: darwin-aarch64
    runs-on: ${{ matrix.runner }}
    env:
      RHOST_NO_SOURCE_BUILD: '1'
      RHOST_NO_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install declared Rust toolchain
        run: |
          rust_version=$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$rust_version" --profile minimal
          rustup override set "$rust_version"
      - name: Install Linux build and disposable SSH fixture tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools openssh-server
          sudo mkdir -p /run/sshd
      - name: Build and checksum the native helper
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          asset="rhost-helper_${version}_${TARGET}"
          helper="$GITHUB_WORKSPACE/target/verified-helper/$asset"
          if [ "$RUNNER_OS" = Linux ]; then
            CC=musl-gcc RHOST_HELPER_STATIC=1 sh scripts/build-helper.sh "$helper"
          else
            CC=clang sh scripts/build-helper.sh "$helper"
          fi
          (cd "$(dirname "$helper")" && shasum -a 256 "$asset" > "$asset.sha256")
          printf 'RHOST_HELPER_BIN=%s\n' "$helper" >> "$GITHUB_ENV"
      - name: Execute exact native helper acceptance
        run: |
          cargo test --locked --test acceptance
          cargo test --locked --features helper-tests --test helper_protocol --test helper_runs --test run_cli
          cargo build --locked --bin rhost
      - name: Execute real SSH acceptance against disposable sshd
        if: runner.os == 'Linux'
        env:
          RHOST_BIN: ${{ github.workspace }}/target/debug/rhost
        run: sh scripts/test-helper-ssh.sh
      - name: Verify the tested helper bytes
        run: |
          cd "$(dirname "$RHOST_HELPER_BIN")"
          shasum -a 256 -c "${RHOST_HELPER_BIN##*/}.sha256"
      - name: Run the sanitizer and allocation-failure suites
        if: matrix.target == 'linux-x86_64'
        env:
          CC: clang
          RHOST_HELPER_SANITIZE: '1'
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          export RHOST_HELPER_BIN="$GITHUB_WORKSPACE/target/helper/rhost-helper-sanitized"
          sh scripts/build-helper.sh "$RHOST_HELPER_BIN"
          export RHOST_HELPER_FAULT_BIN="$GITHUB_WORKSPACE/target/helper/rhost-helper-fault"
          sh scripts/build-helper-fault.sh "$RHOST_HELPER_FAULT_BIN"
          cargo test --locked --features helper-tests,helper-fault-tests --test helper_faults
          cargo test --locked --features helper-tests --test helper_protocol --test helper_runs --test run_cli --test acceptance
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: helper-${{ matrix.target }}
          path: target/verified-helper/*
          if-no-files-found: error
          overwrite: true
          retention-days: 30
