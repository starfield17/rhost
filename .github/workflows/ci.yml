name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both sides of the project are exercised: the remote side is Linux, and the
    # first local side is macOS. OpenSSH, unix sockets, rsync (GNU vs openrsync)
    # and PATH all differ between them, and those are what this tool is made of.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
      - name: Check (gofmt + vet + unit tests + portability, AGENTS.md §1/§9)
        run: make check
      - name: Build
        run: go build ./cmd/rhost
