name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
      - name: Check (gofmt + vet + unit tests + portability, AGENTS.md §1/§9)
        run: make check
      - name: Build
        run: go build ./cmd/rhost
