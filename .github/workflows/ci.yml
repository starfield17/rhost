name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install declared Rust toolchain
        run: |
          rust_version=$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$rust_version" --profile minimal --component rustfmt --component clippy
          rustup override set "$rust_version"
      - run: make check
      - name: Prevent archive or manifest changes after initial freeze
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            git fetch origin "$BASE"
            if git cat-file -e "$BASE:archive/MANIFEST.json" 2>/dev/null; then
              git diff --exit-code "$BASE" HEAD -- archive/
            fi
          fi
