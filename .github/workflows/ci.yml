name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  helper-verify:
    uses: ./.github/workflows/helper-verify.yml
    permissions:
      contents: read
      actions: read
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            helper_target: linux-x86_64
          - os: macos-15
            helper_target: darwin-aarch64
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      RHOST_HELPER_BIN: ${{ github.workspace }}/verified-helper/rhost-helper
      RHOST_NO_SOURCE_BUILD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Fetch source-locked native test helper
        env:
          TARGET: ${{ matrix.helper_target }}
        run: python3 scripts/helper_artifact.py fetch --target "$TARGET" --path "$RHOST_HELPER_BIN"
      - name: Install declared Rust toolchain
        run: |
          rust_version=$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$rust_version" --profile minimal --component rustfmt --component clippy
          rustup override set "$rust_version"
      - run: make check
      - name: Prevent compatibility-baseline and measurement changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            git fetch origin "$BASE"
            if git cat-file -e "$BASE:schemas/compat/result-v2-v4.1.0.schema.json" 2>/dev/null; then
              git diff --exit-code "$BASE" HEAD -- schemas/compat/result-v2-v4.1.0.schema.json
            fi
            ./scripts/check-integrity.sh "$BASE"
          fi
