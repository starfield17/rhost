name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push makes the previous run's answer obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Both sides of the project are exercised: the remote side is Linux, and the
    # first local side is macOS. OpenSSH, unix sockets, rsync (GNU vs openrsync)
    # and PATH all differ between them, and those are what this tool is made of.
    # The labels are pinned rather than `-latest`, and they are the same two the
    # release workflow re-verifies a tag on (docs/architecture/14 §38).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The toolchain is the module's own `go` directive, not a second copy
          # of it here that can drift.
          go-version-file: go.mod
      - name: Check (gofmt + vet + unit tests + portability + release contract, AGENTS.md §1/§9)
        run: make check
      - name: Race detector (Linux)
        # The remote side is concurrent by nature; one platform running the suite
        # under -race is enough to keep that honest without doubling both jobs.
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/rhost
      - name: Rehearse release artifacts
        run: make dist
