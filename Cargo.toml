[package]
name = "rhost"
version = "4.0.0-alpha.1"
edition = "2024"
rust-version = "1.85.0"
publish = false

[[bin]]
name = "rhost"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dev-dependencies]
sha2 = "0.10"
regex = "1"
jsonschema = { version = "0.33", default-features = false }
