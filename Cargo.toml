[package]
name = "rhost"
version = "4.0.0"
edition = "2024"
rust-version = "1.85.0"
publish = false

[features]
live-tests = []

[[bin]]
name = "rhost"
path = "src/main.rs"

[[test]]
name = "live"
path = "tests/live_exec.rs"
required-features = ["live-tests"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dev-dependencies]
regex = "1"
jsonschema = { version = "0.33", default-features = false }
