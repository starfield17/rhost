[package]
name = "rhost"
version = "4.6.0"
edition = "2024"
rust-version = "1.85.0"
publish = false

[features]
live-tests = []
helper-tests = []

[[bin]]
name = "rhost"
path = "src/main.rs"

[[test]]
name = "live"
path = "tests/live_exec.rs"
required-features = ["live-tests"]

[[test]]
name = "helper_protocol"
path = "tests/helper_protocol.rs"
required-features = ["helper-tests"]

[[test]]
name = "helper_runs"
path = "tests/helper_runs.rs"
required-features = ["helper-tests"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
signal-hook = "0.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dev-dependencies]
regex = "1"
jsonschema = { version = "0.58", default-features = false }

# Keep target/ small: the dev/test profiles do not need DWARF, and skipping
# incremental caches costs only seconds on this crate while removing their
# unbounded growth.
[profile.dev]
debug = 0
incremental = false
