[package]
name = "rhost"
version = "5.1.0"
edition = "2024"
rust-version = "1.88.0"
publish = false

[features]
live-tests = []
helper-tests = []
helper-fault-tests = []
helper-live-tests = []

[[bin]]
name = "rhost"
path = "src/main.rs"

[[test]]
name = "live"
path = "tests/live_exec.rs"
required-features = ["live-tests"]

[[test]]
name = "helper_protocol"
path = "tests/helper_protocol.rs"
required-features = ["helper-tests"]

[[test]]
name = "helper_runs"
path = "tests/helper_runs.rs"
required-features = ["helper-tests"]

[[test]]
name = "run_cli"
path = "tests/run_cli.rs"
required-features = ["helper-tests"]

[[test]]
name = "helper_faults"
path = "tests/helper_faults.rs"
required-features = ["helper-fault-tests"]

[[test]]
name = "helper_ssh"
path = "tests/helper_ssh.rs"
required-features = ["helper-live-tests"]

[dependencies]
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
signal-hook = "0.4"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync", "macros", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dev-dependencies]
regex = "1"
jsonschema = { version = "0.60", default-features = false }

# Keep target/ small: the dev/test profiles do not need DWARF, and skipping
# incremental caches costs only seconds on this crate while removing their
# unbounded growth.
[profile.dev]
debug = 0
incremental = false
